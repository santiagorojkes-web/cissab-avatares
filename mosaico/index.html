<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>CISSAB · Mosaico de avatares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  /* ============================================================
     CONFIGURACIÓN — pegá acá EXACTAMENTE el mismo firebaseConfig
     que pegaste en panel-dibujo.html, para que lean la misma base.
  ============================================================= */
  window.FIREBASE_CONFIG = {
    apiKey: "AIzaSyDf7LNppmmDUtWMZfCUulWrH-PMjiuZ2ds",
    authDomain: "cissab-avatares.firebaseapp.com",
    databaseURL: "https://cissab-avatares-default-rtdb.firebaseio.com",
    projectId: "cissab-avatares",
    storageBucket: "cissab-avatares.firebasestorage.app",
    messagingSenderId: "970301310483",
    appId: "1:970301310483:web:17b1f997e4a2fcd0fb61e6",
    measurementId: "G-MV3JP7F49J"
  };
  /* ============================================================ */
</script>
<style>
  :root{
    --naranja:#F4690E;
    --naranja-suave:#FFB27A;
    --azul-profundo:#0F2A4A;
    --azul-medio:#2C5AA0;
    --blanco:#FFFFFF;
    --carbon:#182430;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;color:var(--carbon);
    background:
      radial-gradient(circle at 15% 10%, rgba(244,105,14,0.15), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(44,90,160,0.28), transparent 45%),
      var(--azul-profundo);
    min-height:100vh;
  }
  header{
    display:flex;align-items:center;gap:12px;padding:20px 26px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand-badge{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--naranja),#ff8a3d);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:700;color:#fff;font-size:15px;flex-shrink:0;
  }
  .brand-name{font-family:'Fredoka',sans-serif;font-weight:600;color:#fff;font-size:17px;}
  .brand-sub{font-size:11px;color:var(--naranja-suave);font-weight:500;letter-spacing:0.4px;text-transform:uppercase;}
  .live-dot{
    margin-left:auto;display:flex;align-items:center;gap:16px;
    color:rgba(255,255,255,0.75);font-size:12.5px;font-weight:600;
  }
  .live-count{color:rgba(255,255,255,0.55);font-weight:500;}
  .live-status{display:flex;align-items:center;gap:7px;}
  .live-dot span.dot{
    width:8px;height:8px;border-radius:50%;background:#3ddc84;
    box-shadow:0 0 0 rgba(61,220,132,0.6);animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,220,132,0.5);}
    70%{box-shadow:0 0 0 8px rgba(61,220,132,0);}
    100%{box-shadow:0 0 0 0 rgba(61,220,132,0);}
  }

  main{padding:32px 26px 70px;}
  .mosaico-head{max-width:1200px;margin:0 auto 36px;text-align:center;}
  .mosaico-head h1{
    font-family:'Fredoka',sans-serif;color:#fff;font-weight:700;margin:0;
    font-size:clamp(32px, 6vw, 64px);letter-spacing:0.5px;line-height:1.05;
    text-shadow:0 6px 24px rgba(0,0,0,0.25);
  }

  .mosaico-grid{
    max-width:1200px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 18px;
  }
  .tile{
    background:#fff;padding:8px 8px 10px;border-radius:6px;position:relative;
    box-shadow:0 8px 20px rgba(0,0,0,0.28);
    animation:tileIn .45s ease both;
  }
  .tile-img-wrap{position:relative;}
  .tile-delete{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    background:rgba(15,42,74,0.85);color:#fff;border:none;cursor:pointer;
    display:none;align-items:center;justify-content:center;font-size:15px;line-height:1;
    opacity:0;transform:scale(0.85);transition:opacity .15s ease, transform .15s ease, background .15s ease;
    z-index:2;
  }
  body.admin-mode .tile-delete{display:flex;}
  body.admin-mode .tile:hover .tile-delete{opacity:1;transform:scale(1);}
  .tile-delete:hover{background:#C43D3D;}
  @keyframes tileIn{from{opacity:0;transform:scale(0.82) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .tile::before{
    content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-4deg);
    width:44px;height:16px;background:rgba(244,105,14,0.55);
  }
  .tile.tape-azul::before{background:rgba(44,90,160,0.55);transform:translateX(-50%) rotate(4deg);}
  .tile img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:2px;display:block;background:#fff;}
  .tile .tname{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:var(--azul-profundo);
    text-align:center;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mosaico-empty, .mosaico-loading{
    text-align:center;color:rgba(255,255,255,0.55);padding:90px 20px;font-size:15px;max-width:1200px;margin:0 auto;
  }
  .admin-btn{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);
    font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:background .15s ease;
  }
  .admin-btn:hover{background:rgba(255,255,255,0.16);}
  .admin-btn.is-active{background:var(--naranja);border-color:var(--naranja);color:#fff;}

  .admin-panel{
    position:absolute;top:64px;right:26px;z-index:60;width:230px;
    background:#fff;border-radius:14px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,0.35);
    display:none;
  }
  .admin-panel.open{display:block;}
  .admin-panel h3{font-family:'Fredoka',sans-serif;font-size:14px;margin:0 0 10px;color:var(--azul-profundo);}
  .admin-panel input{
    width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid #E7E1D8;font-size:13px;
    margin-bottom:8px;font-family:'Inter',sans-serif;box-sizing:border-box;
  }
  .admin-panel button{
    width:100%;padding:10px;border:none;border-radius:9px;background:var(--azul-profundo);
    color:#fff;font-weight:600;font-size:13px;cursor:pointer;margin-top:2px;
  }
  .admin-panel .admin-msg{font-size:11.5px;color:#C43D3D;margin-top:8px;min-height:14px;}
  .admin-panel .admin-logout{background:#C43D3D;margin-top:10px;}

  .tile-likes{
    display:flex;align-items:center;justify-content:center;gap:5px;
    background:none;border:none;cursor:pointer;width:100%;padding:5px 0 0;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:#8b97a3;
  }
  .tile-likes .heart{font-size:14px;transition:transform .15s ease;}
  .tile-likes.liked .heart{transform:scale(1.15);}
  .tile-likes.liked{color:#C43D3D;}
  .tile-likes:active .heart{transform:scale(1.3);}
</style>
</head>
<body>
  <header>
    <div class="brand-badge">CB</div>
    <div>
      <div class="brand-name">CISSAB</div>
      <div class="brand-sub">Mosaico de avatares</div>
    </div>
    <button type="button" class="admin-btn" id="adminToggleBtn">🔒 Admin</button>
    <div class="live-dot">
      <span class="live-count" id="liveCount"></span>
      <span class="live-status"><span class="dot"></span>En vivo</span>
    </div>
  </header>

  <div class="admin-panel" id="adminPanel">
    <h3>Acceso admin</h3>
    <input type="email" id="adminEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="adminPassword" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" id="adminLoginBtn">Ingresar</button>
    <div class="admin-msg" id="adminMsg"></div>
  </div>

  <main>
    <div id="configWarning" class="config-warning" style="display:none;">
      ⚠️ Falta pegar el <strong>firebaseConfig</strong> arriba del todo en el código de este archivo (y en panel-dibujo.html), y debe ser el mismo en los dos.
    </div>
    <div class="mosaico-head">
      <h1>MOSAICO CISSABEÑO 2026</h1>
    </div>
    <div id="mosaicoContent"><div class="mosaico-loading">Conectando…</div></div>
  </main>

<script>
(function(){
  let db = null;
  let auth = null;
  let configOk = false;
  try{
    const cfg = window.FIREBASE_CONFIG;
    configOk = cfg && cfg.databaseURL && !String(cfg.databaseURL).includes('PEGÁ_ACÁ');
    if(configOk){
      firebase.initializeApp(cfg);
      db = firebase.database();
      auth = firebase.auth();
    }
  }catch(err){ console.error('Error inicializando Firebase', err); configOk = false; }

  const content = document.getElementById('mosaicoContent');
  const countEl = document.getElementById('liveCount');
  const grid = document.createElement('div');
  grid.className = 'mosaico-grid';
  let count = 0;

  if(!configOk){
    document.getElementById('configWarning').style.display = 'block';
    content.innerHTML = '<div class="mosaico-empty">No se pudo conectar a la base de datos.</div>';
    return;
  }

  content.innerHTML = '';
  content.appendChild(grid);
  content.insertBefore(
    Object.assign(document.createElement('div'), {
      id:'emptyState', className:'mosaico-empty', textContent:'Todavía no hay avatares. ¡Escaneá el QR y sé el primero! 🧡'
    }),
    grid
  );

  // ---------------- Admin: login / logout ----------------
  const adminToggleBtn = document.getElementById('adminToggleBtn');
  const adminPanel = document.getElementById('adminPanel');
  const adminEmail = document.getElementById('adminEmail');
  const adminPassword = document.getElementById('adminPassword');
  const adminMsg = document.getElementById('adminMsg');
  let isAdmin = false;

  adminToggleBtn.addEventListener('click', ()=>{
    if(isAdmin){
      auth.signOut();
      return;
    }
    adminPanel.classList.toggle('open');
  });

  document.getElementById('adminLoginBtn').addEventListener('click', ()=>{
    adminMsg.textContent = '';
    const email = adminEmail.value.trim();
    const pass = adminPassword.value;
    if(!email || !pass){ adminMsg.textContent = 'Completá email y contraseña.'; return; }
    auth.signInWithEmailAndPassword(email, pass).catch(err=>{
      console.error(err);
      adminMsg.textContent = 'No se pudo iniciar sesión. Revisá los datos.';
    });
  });

  auth.onAuthStateChanged((user)=>{
    isAdmin = !!user;
    document.body.classList.toggle('admin-mode', isAdmin);
    adminToggleBtn.classList.toggle('is-active', isAdmin);
    adminToggleBtn.textContent = isAdmin ? '🔓 Salir admin' : '🔒 Admin';
    if(isAdmin){
      adminPanel.classList.remove('open');
      adminEmail.value = '';
      adminPassword.value = '';
      adminMsg.textContent = '';
    }
  });

  function hashStr(s){
    let h=0;
    for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function updateCount(){
    countEl.textContent = count + (count===1 ? ' avatar' : ' avatares');
    document.getElementById('emptyState').style.display = count===0 ? 'block' : 'none';
    grid.style.display = count===0 ? 'none' : 'grid';
  }
  updateCount();

  const ref = db.ref('avatares').limitToLast(1000);
  const tilesByKey = {};

  function likeBtnHtml(key, likes){
    const liked = localStorage.getItem('liked:' + key) === '1';
    return '<button type="button" class="tile-likes'+(liked?' liked':'')+'" data-key="'+key+'">'
         + '<span class="heart">'+(liked ? '❤️' : '🤍')+'</span>'
         + '<span class="like-count">'+likes+'</span>'
         + '</button>';
  }

  function wireLikeBtn(tile, key){
    const btn = tile.querySelector('.tile-likes');
    btn.addEventListener('click', ()=>{
      const storageKey = 'liked:' + key;
      const alreadyLiked = localStorage.getItem(storageKey) === '1';
      const delta = alreadyLiked ? -1 : 1;
      db.ref('avatares/' + key + '/likes').transaction(curr => Math.max(0, (curr||0) + delta));
      if(alreadyLiked){ localStorage.removeItem(storageKey); btn.classList.remove('liked'); btn.querySelector('.heart').textContent = '🤍'; }
      else{ localStorage.setItem(storageKey, '1'); btn.classList.add('liked'); btn.querySelector('.heart').textContent = '❤️'; }
    });
  }

  ref.on('child_added', (snapshot)=>{
    const r = snapshot.val();
    if(!r || !r.img) return;
    const key = snapshot.key;
    const idx = count;
    count++;
    const tape = (hashStr((r.name||'') + idx) % 2 === 0) ? '' : ' tape-azul';
    const rot = (hashStr('r' + (r.name||'') + idx) % 7) - 3;
    const safeName = escapeHtml(r.name || 'Sin nombre');
    const tile = document.createElement('div');
    tile.className = 'tile' + tape;
    tile.style.transform = 'rotate(' + rot + 'deg)';
    tile.innerHTML =
      '<div class="tile-img-wrap">'
      + '<img src="'+r.img+'" alt="'+safeName+'" loading="lazy">'
      + '<button type="button" class="tile-delete" title="Eliminar avatar">✕</button>'
      + '</div>'
      + '<div class="tname">'+safeName+'</div>'
      + likeBtnHtml(key, r.likes || 0);
    tile.querySelector('.tile-delete').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm('¿Eliminar el avatar de "'+ (r.name||'este socio') +'"? No se puede deshacer.')) return;
      db.ref('avatares/' + key).remove().catch(err=>{
        console.error(err);
        alert('No se pudo eliminar. Revisá las reglas de Firebase (deben permitir borrar).');
      });
    });
    wireLikeBtn(tile, key);
    grid.appendChild(tile);
    tilesByKey[key] = tile;
    updateCount();
  });

  ref.on('child_changed', (snapshot)=>{
    const key = snapshot.key;
    const tile = tilesByKey[key];
    if(!tile) return;
    const r = snapshot.val() || {};
    const countSpan = tile.querySelector('.like-count');
    if(countSpan) countSpan.textContent = r.likes || 0;
  });

  ref.on('child_removed', (snapshot)=>{
    const key = snapshot.key;
    const tile = tilesByKey[key];
    if(tile){
      tile.remove();
      delete tilesByKey[key];
      count = Math.max(0, count - 1);
      updateCount();
    }
  });

  ref.on('cancelled', (err)=>{
    console.error('Firebase permission error', err);
    content.innerHTML = '<div class="mosaico-empty">No pudimos leer el mosaico (revisá las reglas de la base).</div>';
  });
})();
</script>
</body>
</html>
